<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>

  <body>
    <header class="navbar">
      <h1>Just in Time</h1>

      <nav>
        <a href="produto.html" class="ativo">Produtos</a>
        <a href="producao.html">Produção</a>
      </nav>

      <div class="usuario">
        <span id="nomeUsuario">Usuário</span>
        <button id="btnSair">Sair</button>
      </div>
    </header>

    <main class="produto">
      <h2>Cadastro de Produtos</h2>

      <section>
        <h3>Buscar produto</h3>

        <input type="text" id="busca" placeholder="Digite o nome do produto" />

        <button type="button" id="btnBuscar">Buscar</button>
        <button type="button" id="btnLimpar">Limpar</button>
      </section>

      <section>
        <h3>Novo Produto</h3>

        <form id="formProduto">
          <input type="hidden" id="produtoId" />

          <label for="nome">Nome</label>

          <input type="text" id="nome" placeholder="Nome do produto" required />

          <label for="descricao">Descrição</label>

          <input
            type="text"
            id="descricao"
            placeholder="Descrição do produto"
          />

          <label for="custo">Custo</label>

          <input
            type="number"
            id="custo"
            step="0.01"
            min="0"
            placeholder="0.00"
            required
          />

          <label for="quantidadeEstoque">Quantidade em estoque</label>

          <input
            type="number"
            id="quantidadeEstoque"
            min="0"
            placeholder="Quantidade"
            required
          />

          <label for="estoqueMinimo">Estoque mínimo</label>

          <input
            type="number"
            id="estoqueMinimo"
            min="0"
            placeholder="Estoque mínimo"
            required
          />

          <button type="submit" id="btnSalvar">Cadastrar</button>

          <button type="button" id="btnCancelar">Cancelar</button>
        </form>

        <p id="mensagem"></p>
      </section>

      <section>
        <h3>Produtos cadastrados</h3>

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Custo</th>
              <th>Estoque</th>
              <th>Mínimo</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="listaProdutos"></tbody>
        </table>
      </section>
    </main>

    <script src="../scripts/produto.js"></script>
  </body>
</html>
